mapping:
  # CNN feature extraction configuration
  color: cnn                        # Use CNN features
  cnn_mode: cnn                     # CNN-only or rgb_cnn mode
  cnn_layer_name: conv1            # Which layer: conv1, layer1, layer2
  cnn_channels: 8                   # How many channels to use
  cnn_channel_select: "all"     # Which channels: "d60,d2" (0-based), "all", etc.
  cnn_layer_full_channels: 64       # Total channels in selected layer (64 for conv1/layer1, 128 for layer2)
  
  # EXAMPLES - uncomment to switch layer:
  # For layer2 with channels d100 and d5:
  #   cnn_layer_name: layer2
  #   cnn_channels: 2
  #   cnn_channel_select: "d100,d5"
  #   cnn_layer_full_channels: 128
  # For conv1 with random 8 channels:
  #   cnn_layer_name: conv1
  #   cnn_channels: 8
  #   cnn_channel_select: "all"
  #   cnn_layer_full_channels: 64
  corr:
    corr_mode: logz
    corr_thresh: 0.03
    distill_with_prior: true
    logz_grad_mag_thresh: 0.07
    min_obs_depth: 0.0
  device: cuda:0
  dtype: double
  graph:
    num_keyframes: 9
    num_one_way_frames: 24
  init:
    delta_norm: 0.0001
    end_level: 3
    kf_depth_motion_ratio: 0.04
    kf_num_pixels_frac: 0.75
    max_iter: 50
    rel_tol: 0.0001
    start_level: 0
  model_path: models/scannet.ckpt
  photo_construction:
    degrees_thresh: 0.0
    nonmax_suppression_window: 4
    pairwise_batch_size: 128
    radius_thresh: 0.0
  sampling:
    border: 3
    dist_thresh: 0.1
    fixed_var: 0.0
    max_num_coords: 64
    max_stdev_thresh: 0.01
    mode: greedy_conditional_entropy
  sigmas:
    mean_depth_prior: 0.01
    photo: 0.1
    pose_prior: 1.0e-06
    scale_prior: 1.0e-10
  term_criteria:
    abs_tol: 1.0e-06
    delta_norm: 1.0e-08
    max_iter: 20
    rel_tol: 1.0e-06
  track_ref:
    num_keyframes: 1
name: Depth odom config

tracking:
  # CNN feature extraction configuration (same schema as mapping)
  color: cnn                        # Use CNN features
  cnn_mode: cnn                     # CNN-only or rgb_cnn mode
  cnn_layer_name: "all"            # Which layer: conv1, layer1, layer2
  cnn_channels: 8                   # How many channels to use
  cnn_channel_select: "all"     # Which channels: "d60,d2" (0-based), "all", etc.
  cnn_layer_full_channels: 64       # Total channels in selected layer (64 for conv1/layer1, 128 for layer2)
  device: cuda:0
  dtype: float
  
  # EXAMPLES - uncomment to switch layer (see mapping section for more):
  # For layer2 with channels d100 and d5:
  #   cnn_layer_name: layer2
  #   cnn_channels: 2
  #   cnn_channel_select: "d100,d5"
  #   cnn_layer_full_channels: 128
  keyframing:
    kf_depth_motion_ratio: 0.12
    kf_num_pixels_frac: 0.75
    one_way_freq: 3
  pyr:
    depth_interp_mode: nearest_neighbor
    end_level: 3
    start_level: 0
  sigmas:
    photo: 0.1
  term_criteria:
    delta_norm: 0.001
    grad_norm: 1.0
    max_iter: 50
    rel_tol: 0.001
